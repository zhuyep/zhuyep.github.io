<body>
  <canvas id="canvas" aria-label="Hextris 游戏画面：旋转六边形，消除相邻同色方块"></canvas>
  <div id="overlay" class="faded overlay"></div>
  <button id="startBtn" type="button" aria-label="点击中央六边形开始游戏"></button>
  <div id="helpScreen" class="unselectable"><div id="inst_main_body"></div></div>
  <img id="openSideBar" class="helpText" src="images/btn_help.svg" alt="玩法">
  <img id="pauseBtn" src="images/btn_pause.svg" alt="暂停">
  <img id="restartBtn" src="images/btn_restart.svg" alt="重新开始">
  <div id="HIGHSCORE" hidden></div>
  <div id="highScoreInGameText"><div id="highScoreInGameTextHeader">本机最佳</div><div id="currentHighScore">0</div></div>
  <p class="local-guide">转动六边形 · 同色相邻 3 块即可消除</p>
  <div id="gameoverscreen">
    <div id="container">
      <div id="gameOverBox" class="GOTitle">这一局结束</div>
      <div id="cScore">0</div>
      <div id="highScoresTitle" class="GOTitle">本机最佳</div>
      <div class="score"><span class="scoreNum">1.</span> <span id="1place">0</span></div>
      <div class="score"><span class="scoreNum">2.</span> <span id="2place">0</span></div>
      <div class="score"><span class="scoreNum">3.</span> <span id="3place">0</span></div>
    </div>
    <div id="bottomContainer"><img id="restart" src="images/btn_restart.svg" alt="再来一局"><div id="buttonCont"></div></div>
  </div>
  <nav class="local-controls" aria-label="游戏控制">
    <button id="rotate-left" type="button" disabled><span aria-hidden="true">↶</span> 左转</button>
    <button id="local-action" type="button">开始</button>
    <button id="rotate-right" type="button" disabled>右转 <span aria-hidden="true">↷</span></button>
  </nav>
  <footer class="local-footer"><button id="local-help" type="button">玩法</button><span>HEXTRIS</span><button id="local-about" type="button">来源与许可</button></footer>
  <dialog id="local-dialog" aria-labelledby="dialog-title">
    <h1 id="dialog-title">Hextris</h1>
    <div id="dialog-body"></div>
    <button id="dialog-close" type="button">知道了</button>
  </dialog>
