<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>网站管理 · 诸事大吉</title><link rel="stylesheet" href="/styles.css"><style>main{max-width:1100px;margin:auto;padding:28px 20px}input,select,button{font:inherit;padding:10px}table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:left;border-bottom:1px solid var(--line);padding:12px 8px;white-space:nowrap}.scroll{overflow:auto}#status{color:var(--red)}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}</style><main><div class="top"><h1>网站管理</h1><a href="/">← 返回网站</a></div><p>访问明细仅管理员可见。IP 与大致地区不能确认具体个人。</p><form id="login"><label>独立管理密码 <input id="password" type="password" autocomplete="current-password" required maxlength="256"></label><button>登录</button></form><p id="status" role="status"></p><section id="dashboard" hidden><div class="top"><label>统计范围 <select id="days"><option value="1">最近24小时</option><option value="7" selected>最近7天</option><option value="30">最近30天</option></select></label><button id="refresh">刷新</button><button id="logout">退出管理</button></div><div id="summary" class="visit-totals"></div><p id="identity"></p><h2>不同 IP 的访问情况</h2><p>最多显示最近访问的200个 IP，明细最多100条；总数按所选范围完整计算。</p><div id="visitors" class="scroll"></div><h2>影院访问与搜索</h2><p>只记录进入影院与已通过观影权限校验的搜索，不记录播放进度；最多显示200条，展示近30天。IP不能确认具体个人。</p><p id="cinema-summary"></p><div id="cinema-events" class="scroll"></div><h2>最近访问</h2><div id="recent" class="scroll"></div><p>时间按北京时间显示。地区来自网络估算，可能是代理或运营商位置。展示近30天，过期明细在后续访问或管理查询时清理；启用前没有 IP 明细，未采集到的访问无法补算。</p></section></main><script type="module" src="/assets/admin.js"></script></html>
